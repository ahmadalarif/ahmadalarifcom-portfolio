  <style>
    body {
      background: url("/assets/ahmad-arif-portfolio-background.webp") no-repeat center center fixed;
      background-size: cover;
      font-family: "Arial", sans-serif;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.85);
      padding: 2rem;
      border-radius: 0.5rem;
      backdrop-filter: blur(4px);
    }

    .project-item {
      background: rgba(44, 62, 80, 0.9);
      border: 1px solid #2c3e50;
      color: #ecf0f1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      border-radius: 8px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
    }

    .project-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .project-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    .portfolio-button {
      align-items: center;
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.95), rgba(37, 99, 235, 0.95));
      border: 1px solid rgba(125, 211, 252, 0.55);
      border-radius: 8px;
      box-shadow: 0 10px 24px rgba(2, 132, 199, 0.24);
      color: #ffffff;
      display: inline-flex;
      font-weight: 700;
      justify-content: center;
      min-height: 44px;
      padding: 0.7rem 1rem;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .portfolio-button:hover {
      border-color: rgba(186, 230, 253, 0.92);
      box-shadow: 0 14px 30px rgba(2, 132, 199, 0.34);
      transform: translateY(-2px);
    }

    .portfolio-button:focus-visible {
      outline: 3px solid rgba(125, 211, 252, 0.42);
      outline-offset: 3px;
    }

    .portfolio-button.secondary {
      background: rgba(15, 23, 42, 0.74);
      border-color: rgba(148, 163, 184, 0.44);
      box-shadow: 0 10px 24px rgba(2, 6, 23, 0.24);
    }

    .portfolio-button.whatsapp-button {
      background: linear-gradient(135deg, #25d366, #128c7e);
      border-color: rgba(187, 247, 208, 0.55);
      box-shadow: 0 10px 24px rgba(18, 140, 126, 0.24);
    }

    .portfolio-button.youtube-button {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      border-color: rgba(254, 202, 202, 0.5);
      box-shadow: 0 10px 24px rgba(185, 28, 28, 0.24);
    }

    .project-link {
      margin-top: auto;
      width: fit-content;
    }

    .project-preview {
      aspect-ratio: 16 / 9;
      background: #020617;
      border: 1px solid rgba(125, 211, 252, 0.22);
      border-radius: 8px;
      margin-bottom: 16px;
      overflow: hidden;
      width: 100%;
    }

    .project-preview video {
      display: block;
      height: 100%;
      object-fit: cover;
      width: 100%;
    }

    .video-showcase {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(12, 74, 110, 0.72));
      border: 1px solid rgba(125, 211, 252, 0.24);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 18px 42px rgba(2, 6, 23, 0.34);
    }

    .video-card {
      background: rgba(15, 23, 42, 0.76);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .video-card:hover {
      transform: translateY(-4px);
      border-color: rgba(125, 211, 252, 0.72);
    }

    .video-card video {
      aspect-ratio: 16 / 9;
      background: #020617;
      display: block;
      width: 100%;
    }

    .video-card.mobile-demo video {
      aspect-ratio: 9 / 16;
      max-height: 560px;
      object-fit: contain;
    }

    .video-meta {
      padding: 16px;
    }

    .video-kicker {
      color: #7dd3fc;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .whatsapp-button img {
      width: 24px;
      height: 24px;
      margin-right: 0.5rem;
      transition: transform 0.2s ease;
    }

    [dir="rtl"] .whatsapp-button img {
      margin-right: 0;
      margin-left: 0.5rem;
    }
    .social-link {
      display: inline-flex;
      align-items: center;
    }

    .social-link svg {
      transition: transform 0.2s ease;
    }

    .social-link:hover svg {
      transform: scale(1.1);
    }

    @media (prefers-reduced-motion: reduce) {
      .project-item,
      .video-card,
      .portfolio-button,
      .whatsapp-button img {
        transition: none;
      }
    }

    @media (max-width: 640px) {
      .whatsapp-button img {
        width: 20px;
        height: 20px;
      }
    }
        @media (prefers-reduced-motion: reduce) {
      .social-link,
      .social-link svg {
        transition: none;
      }
    }
